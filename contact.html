  <meta name="description" content="Contact Jorge Contreras - Get in touch for projects, collaboration, or inquiries.">
  <title>Contact &mdash; Jorge Contreras</title>

<body class="contact-page">

  <!-- Navigation -->

    <div class="container nav-wrapper">
      <a href="index.html" class="brand-name">Jorge Contreras</a>
      <nav class="nav-links">

        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon">◐</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container contact-page-container">
      
      <div class="page-heading-group">
        <p class="intro-label">Get in Touch</p>
        <h1 class="page-main-title">Contact</h1>
        <p class="page-main-sub">Have a question, collaboration idea, or want to say hello? Send a note below.</p>
      </div>

      <form id="standaloneContactForm" class="contact-page-form">
        <div class="form-group">
          <label for="pageContactName">Your Name</label>
          <input type="text" id="pageContactName" name="name" required autocomplete="off" placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label for="pageContactEmail">Email, Phone, or Preferred Contact</label>
          <input type="text" id="pageContactEmail" name="contact_info" required autocomplete="off" placeholder="Email, phone number, or handle">
        </div>
        <div class="form-group">
          <label for="pageContactMsg">Message</label>
          <textarea id="pageContactMsg" name="message" rows="5" required placeholder="What's on your mind?"></textarea>
        </div>
        <button type="submit" class="btn-editorial" style="align-self: flex-start; min-width: 160px;">Send Message</button>
        <div id="pageContactStatus" class="modal-status" style="margin-top: 10px;"></div>
      </form>

    </div>
  </main>
