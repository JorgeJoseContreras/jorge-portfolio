<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jorge Contreras - Terminal">
  <title>jorge@terminal:~$</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="terminal-body">

  <main class="terminal-screen" id="terminalScreen">
    <div class="terminal-output" id="terminalOutput"></div>
    <div class="terminal-prompt-line" id="promptLine">
      <span class="prompt-user">jorge@terminal</span><span class="prompt-symbol">:~$</span>
      <input 
        type="text" 
        id="cliInput" 
        class="cli-input" 
        autofocus 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="off" 
        spellcheck="false" 
        aria-label="Terminal Command Line"
      />
      <span class="cursor-block">&#9608;</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
